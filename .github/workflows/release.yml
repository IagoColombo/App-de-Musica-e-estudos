name: Publicar LyraFlow para Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        shell: pwsh
        working-directory: C:\
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone "${{ github.repository }}" 'C:\lyraflow-source' -- --no-checkout
          git -C 'C:\lyraflow-source' checkout "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: C:\lyraflow-source
      - run: npm run desktop:build
        working-directory: C:\lyraflow-source
      - name: Publicar executável e instalador
        shell: pwsh
        working-directory: C:\lyraflow-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = 'src-tauri/target/release/lyraflow.exe'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not (Test-Path $exe) -or -not $installer) { throw 'Build Windows incompleto.' }
          gh release create "build-${{ github.sha }}" $exe $installer --title "LyraFlow ${{ github.sha }}" --notes "Build automático do commit ${{ github.sha }}." --prerelease --target "${{ github.sha }}"
